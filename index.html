<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mafe 💖</title>

<style>
body{
    margin:0;
    padding:0;
    background:black;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:white;
    text-align:center;
}

/* GALAXIA */
.stars{
    width:100%;
    height:100vh;
    position:absolute;
    background:black;
}

.stars::after{
    content:"";
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    box-shadow:
    50px 80px white,
    150px 200px white,
    300px 400px white,
    500px 100px white,
    700px 300px white,
    900px 200px white,
    200px 600px white,
    400px 500px white,
    800px 700px white,
    1000px 350px white;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:0.3;}
    to{opacity:1;}
}

/* CONTENIDO */
.container{
    position:relative;
    top:20%;
    z-index:2;
}

/* CORAZÓN LATIENDO */
.heart{
    font-size:100px;
    animation:beat 1s infinite;
}

@keyframes beat{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

#text{
    margin-top:20px;
    font-size:22px;
}

/* BOTÓN */
button{
    margin-top:30px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:25px;
    background:#ff4d6d;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

.hidden{
    display:none;
    margin-top:20px;
    font-size:20px;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
    <h1>Para ti 💖</h1>

    <div class="heart">❤️</div>

    <div id="text"></div>

    <button onclick="mostrarMensaje()">
        Presiona si me amas 😌
    </button>

    <div id="sorpresa" class="hidden">
        Sabía que sí... y yo te amo muchísimo más 💞🌙
    </div>
</div>

<script>
const frases = [
"Desde que llegaste a mi vida...",
"todo cambió para mejor...",
"y no quiero perderte nunca 💖"
];

let i = 0;
let j = 0;
let actual = "";

function escribir(){
    if(i < frases.length){
        if(j < frases[i].length){
            actual += frases[i][j];
            document.getElementById("text").innerHTML = actual;
            j++;
            setTimeout(escribir,50);
        }else{
            i++;
            j = 0;
            actual += "<br><br>";
            setTimeout(escribir,500);
        }
    }
}

function mostrarMensaje(){
    document.getElementById("sorpresa").classList.remove("hidden");
}

escribir();
</script>

</body>
</html>
